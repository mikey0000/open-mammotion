[project]
name = "open-mammotion"
version = "0.1.0"
description = "Async Python client for the Mammotion Open API (developer platform)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
authors = [{ name = "Michael Arthur" }]
keywords = ["mammotion", "luba", "yuka", "mower", "open-api", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10",
    "mashumaro>=3.13",
    "orjson>=3.9",
]

[project.urls]
Homepage = "https://github.com/mikey0000/open-mammotion"
Documentation = "https://github.com/mikey0000/open-mammotion/tree/main/docs"
"Mammotion developer portal" = "https://developer.mammotion.com"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "time-machine>=2.16",
    "ty>=0.0.1a8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_mammotion"]

[tool.ruff]
required-version = ">=0.8"
line-length = 120
target-version = "py313"
exclude = [".venv", ".claude"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",  # no copyright headers
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # formatter owns line length
    "COM812",  # conflicts with formatter
    "ISC001",  # conflicts with formatter
    "TRY003",  # exception messages are built at the raise site by design (exceptions.py owns the types)
    "PLR2004", # magic-value rule fires on HTTP statuses and enum wire values that are named by context
    "FIX002",  # TODOs are allowed when they cite a backlog entry
    "TD002",   # no author on TODOs
    "TD003",   # backlog entries, not issue links
    "D105",    # magic methods (__repr__) are self-describing
    "D106",    # nested Config classes are mashumaro plumbing
    "D107",    # __init__ is documented by the class docstring
    "EM101",   # exception text is assembled at the raise site (exceptions.py owns the types)
    "EM102",
]

[tool.ruff.lint.pylint]
max-args = 7  # HttpSession.request: method, url and four keyword-only options

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the test primitive
    "S105",    # fixture "secrets" are obviously fake
    "S106",
    "S107",
    "D",       # docstrings only where the constitution asks (regression tests)
    "ANN401",  # fakes take Any where the real protocol does
    "SLF001",  # a unit test may inspect its own module's privates
    "PLR0913", # fixtures fan in
    "ARG",     # fakes accept the protocol's parameters and ignore some
    "INP001",  # test dirs need no __init__ for pytest rootdir discovery — they have one anyway
    "FBT001",  # parametrised boolean cases are the point of the test
    "PT018",   # a compound assert on one recorded call reads as one fact
]
"tests/fakeserver/**" = [
    "S104",    # binding 0.0.0.0 is never done; loopback only, but keep the rule quiet for aiohttp's API
    "C901",    # a validating fake has branchy handlers by nature
    "PLR0911",
    "PLR0912",
    "TRY301",  # validation raises inside the handler's try so one except maps to one envelope
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["open_mammotion", "tests"]

[tool.ruff.lint.flake8-type-checking]
strict = true
# mashumaro resolves field annotations at class-creation time, so model modules import them for real
runtime-evaluated-base-classes = ["open_mammotion.models.common.WireModel", "mashumaro.mixins.orjson.DataClassORJSONMixin"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["open_mammotion"]
exclude = ["tests/**"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "regression: pins a bug that escaped; seen red before the fix (docs/testing.md §7)",
    "live: talks to the real Open API; needs OPEN_MAMMOTION_CLIENT_ID/SECRET",
]
addopts = "-m 'not live' --strict-markers -ra"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["open_mammotion"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "\\.\\.\\.$",
]
