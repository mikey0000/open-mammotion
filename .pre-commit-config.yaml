repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check open_mammotion/
        language: system
        pass_filenames: false
        types: [python]
      - id: unit-tests
        name: unit tests
        entry: uv run pytest tests/unit tests/meta -q
        language: system
        pass_filenames: false
        types: [python]
